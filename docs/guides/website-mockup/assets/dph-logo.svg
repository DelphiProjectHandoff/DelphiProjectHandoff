      <rect x="431" y="140" width="486" height="704" rx="58" fill="url(#front)" stroke="#66DFFF" stroke-width="8"/>
      <circle cx="492" cy="202" r="18" fill="#E8F8FF"/><circle cx="548" cy="202" r="18" fill="#D0EFFB"/><circle cx="604" cy="202" r="18" fill="#B2E3FA"/>
      <rect x="470" y="266" width="408" height="524" rx="30" fill="url(#paper)"/>
      <rect x="521" y="335" width="309" height="240" rx="20" fill="url(#scene)"/>
      <circle cx="765" cy="395" r="27" fill="#F1FBFF"/>
      <path d="M521 548l93-104 51 47 76-91 89 94v81H521z" fill="#2787D1"/>
      <path d="M521 575l112-76 47 32 67-50 83 65v29z" fill="#1477C2"/>
      <path d="M532 643h288M532 692h266M532 741h242" stroke="#77B9E7" stroke-width="22" stroke-linecap="round"/>
    </g>
  </g>
  <path d="M276 486C393 439 481 463 518 543c39 85 130 92 268 56" fill="none" stroke="#FFFFFF" stroke-width="85" stroke-linecap="round"/>
  <path d="M276 486C393 439 481 463 518 543c39 85 130 92 268 56" fill="none" stroke="url(#route)" stroke-width="69" stroke-linecap="round"/>
  <path d="M738 518l135 81-139 96z" fill="url(#route)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
</g>
