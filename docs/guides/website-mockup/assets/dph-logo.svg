<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="brandTitle brandDesc">
  <title id="brandTitle">Delphi Project Handoff horizontal logo</title>
  <desc id="brandDesc">Two application screens joined by an orange route, beside the Delphi Project Handoff wordmark.</desc>
  <g transform="translate(20 25) scale(.42)"><defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29B9F1"/><stop offset=".42" stop-color="#087CCF"/><stop offset="1" stop-color="#074DAB"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1EC5F6"/><stop offset=".4" stop-color="#087BDD"/><stop offset="1" stop-color="#07419A"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#D8F2FF"/></linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A7DDFB"/><stop offset="1" stop-color="#52ABF0"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB631"/><stop offset=".55" stop-color="#F28C28"/><stop offset="1" stop-color="#E95D13"/></linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="145%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#10385C" flood-opacity=".25"/></filter>
  </defs>
  <g filter="url(#lift)">
    <g transform="rotate(-11 375 535)">
      <rect x="94" y="258" width="570" height="575" rx="62" fill="#06448F"/>
      <rect x="104" y="248" width="560" height="572" rx="61" fill="url(#back)" stroke="#66DFFF" stroke-width="8"/>
      <circle cx="158" cy="302" r="17" fill="#DDF6FF"/><circle cx="208" cy="302" r="17" fill="#C5EDFC"/><circle cx="258" cy="302" r="17" fill="#AADFF9"/>
      <rect x="143" y="354" width="482" height="420" rx="30" fill="url(#paper)"/>
      <circle cx="204" cy="433" r="18" fill="#F28C28"/><circle cx="204" cy="527" r="18" fill="#7FBDE7"/><circle cx="204" cy="621" r="18" fill="#7FBDE7"/>
      <path d="M253 433h275M253 527h230M253 621h260" stroke="#83BFE8" stroke-width="28" stroke-linecap="round"/>
    </g>
    <g transform="rotate(7 672 526)">
