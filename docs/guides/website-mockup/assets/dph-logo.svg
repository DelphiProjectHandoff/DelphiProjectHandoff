  <text x="478" y="345" fill="#123A63" font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="174" font-weight="600">Handoff</text>
  <path d="M495 393h635" stroke="#F28C28" stroke-width="9" stroke-linecap="round"/>
</svg>
